schema = "dfmcp.dependency-allowlist.v1"
policy = "closed-universe"
toolchain = "nightly"
edition = "2024"
unsafe_code = "forbid"

[classes]
standard_library = ["core", "alloc", "std"]
owned_runtime_prefixes = ["asupersync"]
# ADR-013: the MCP presentation plane is the owned fastmcp_rust sibling.
owned_mcp_prefixes = ["fastmcp"]
owned_franken_prefixes = ["franken", "fsqlite", "ffs", "fnx", "fgdb"]
fundamental_external = ["serde", "serde_json"]

[phase_zero]
# Non-owned, explicitly admitted direct dependencies. Empty by design: the
# presentation plane is owned (fastmcp_rust), and serialization stays in
# fundamental_external.
external_runtime_dependencies = []

[mcp_transport]
# The single admitted MCP framework; any second MCP crate is a policy failure
# (ADR-013). The pin is an exact upstream revision so dogfooding is explicit:
# bumping the pin is the mechanism for taking upstream fixes, and every pin
# bump ships with a conformance note in docs/DOGFOODING_FASTMCP.md.
crate = "fastmcp-rust"
repository = "https://github.com/Dicklesworthstone/fastmcp_rust"
pin = "6481d49a6f9282f8161015323283fb7764dcf2f7"
profile = "modern-only-mcp-2026-07-28"
required_features = ["tasks"]
forbidden_features = [
  "legacy-2024-11-05",
  "websocket-experimental",
  "apps",
  "proxy",
  "proxy-legacy",
  "proxy-tasks",
  "enterprise-auth",
  "oauth-client-credentials",
  "builtin-auth-server",
  "redis-tasks",
  "jwt-resource-auth",
  "testing-lab",
]

[admitted]
# Non-owned packages tolerated inside Cargo.lock despite the prohibited list.
# Each exception names the owned path that pulls it and must never appear as
# a direct declaration in any workspace manifest.
#
# prost: transitive of asupersync v0.4.9 (owned runtime; internal OTLP
# evidence mapping). The dfmcp trust domain never references prost; the
# DFHack bridge protocol remains a design artifact in proto/dfmcp.proto.
lock_exceptions = ["prost"]

[prohibited]
crates = [
  "tokio", "async-std", "smol", "rayon", "petgraph", "rusqlite", "sqlx",
  "diesel", "rocksdb", "lmdb", "reqwest", "hyper", "axum", "tonic",
  "tower", "prost", "tantivy", "hnsw", "memmap2", "arc-swap"
]

[requirements]
adr_for_new_exception = true
exact_features_required = true
build_script_audit_required = true
unsafe_audit_required = true
deterministic_lab_audit_required = true
