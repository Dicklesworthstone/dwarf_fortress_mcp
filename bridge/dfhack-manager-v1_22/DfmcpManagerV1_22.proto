syntax = "proto2";
package dfmcp.manager.v1_22;
message Request {
    required bytes bearer_token = 1;
    required bytes client_nonce = 2;
    required uint32 protocol_major = 3;
    required uint32 protocol_minor = 4;
    required uint32 max_wall_millis = 5;
    optional uint32 unit_id = 6;
    optional uint32 histfig_id = 7;
    optional string idempotency_key = 9;
    optional bytes expected_witness = 10;
    optional bytes plan_digest = 11;
    optional bytes prepare_token = 12;
}
message Reply {
    required bool accepted = 1;
    required uint32 failure_code = 2;
    required bytes client_nonce = 3;
    required uint32 protocol_major = 4;
    required uint32 protocol_minor = 5;
    required uint64 bridge_generation = 6;
    required string df_version = 7;
    required string dfhack_version = 8;
    optional bytes observation = 9;
    optional bytes effect_record = 10;
    optional bool replayed = 11;
    optional bool unresolved = 12;
    optional uint32 retained_records = 13;
}
