syntax = "proto2";
package dfmcp.operations.v1_4;
option optimize_for = LITE_RUNTIME;
message Request {
  required bytes bearer_token = 1;
  required bytes client_nonce = 2;
  required uint32 protocol_major = 3;
  required uint32 protocol_minor = 4;
  required uint32 max_jobs = 5;
  required uint32 max_buildings = 6;
  required uint32 max_items = 7;
  required uint32 max_bytes = 8;
  optional bytes snapshot_token = 9;
  optional uint64 offset = 10 [default = 0];
  optional uint32 page_bytes = 11 [default = 65536];
  optional bool release = 12 [default = false];
}
message Reply {
  required bool accepted = 1;
  required uint32 failure_code = 2;
  required bytes client_nonce = 3;
  required uint32 protocol_major = 4;
  required uint32 protocol_minor = 5;
  required uint64 bridge_generation = 6;
  required string df_version = 7;
  required string dfhack_version = 8;
  optional bytes observation = 9;
  optional bytes snapshot_token = 10;
  optional uint64 offset = 11;
  optional uint64 total_bytes = 12;
  optional bytes payload_sha256 = 13;
  optional bool complete = 14;
}
